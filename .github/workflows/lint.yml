name: lint

# Quality gate only. Delivery to PCs is tools/publish.ps1 (OneDrive), not CI.
# Nothing here installs software: every test runs the kit in -DryRun mode.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps51:
    name: Windows PowerShell 5.1 (parse, core, loader + classic menu)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parser check under 5.1
        shell: powershell
        run: ./tools/lint.ps1 -ParseOnly
      - name: Core engine tests (dry run)
        shell: powershell
        run: ./tools/test-core.ps1
      - name: Loader decisions + classic menu (dry run)
        shell: powershell
        run: ./tools/smoke-loader.ps1

  pwsh:
    name: PowerShell 7 (lint, core, Spectre menu)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parser check + PSScriptAnalyzer
        shell: pwsh
        run: ./tools/lint.ps1
      - name: Core engine tests (dry run, resolves vendor download pages)
        shell: pwsh
        run: ./tools/test-core.ps1 -Online
      - name: Install PwshSpectreConsole
        shell: pwsh
        run: Install-PSResource -Name PwshSpectreConsole -Scope CurrentUser -TrustRepository -Quiet
      - name: Spectre menu smoke test (scripted keys, dry run)
        shell: pwsh
        run: ./tools/smoke-tui.ps1
